<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS 网页版</title>
<link rel="icon" href="assets/icons/finder.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/apps2.css">
</head>
<body>
<!-- 全局遮罩层：亮度 / 夜览 -->
<div id="overlay-brightness" aria-hidden="true"></div>
<div id="overlay-nightshift" aria-hidden="true"></div>

<!-- 桌面层 -->
<div id="desktop" class="hidden" aria-label="桌面">
  <div id="desktop-icons"></div>
</div>

<!-- 窗口层 -->
<div id="window-layer"></div>

<!-- 菜单栏 -->
<header id="menubar" class="hidden">
  <div id="menubar-left"></div>
  <div id="menubar-right"></div>
</header>

<!-- Dock -->
<div id="dock-hotzone" aria-hidden="true"></div>
<nav id="dock" class="hidden" aria-label="程序坞"></nav>

<!-- 控制中心 / 通知中心 / Spotlight -->
<div id="control-center" class="popover hidden" role="dialog" aria-label="控制中心"></div>
<aside id="notification-center" class="hidden" aria-label="通知中心"></aside>
<div id="spotlight" class="hidden" role="dialog" aria-label="聚焦搜索">
  <div id="spotlight-box">
    <div id="spotlight-input-row">
      <svg viewBox="0 0 24 24" width="20" height="20" class="sp-icon"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <input id="spotlight-input" type="text" placeholder="聚焦搜索" autocomplete="off" spellcheck="false">
    </div>
    <div id="spotlight-results"></div>
  </div>
</div>

<!-- 通知横幅容器 -->
<div id="banner-container"></div>

<!-- 用户登录界面 -->
<div id="login-screen" class="hidden">
  <div id="login-bg"></div>
  <div id="login-container">
    <div id="login-title">选择用户</div>
    <div id="login-users">
      <div class="login-user-card" data-user="henry" tabindex="0" role="button" aria-label="Henry">
        <div class="login-user-avatar-ring">
          <img class="login-user-avatar" src="assets/icons/henry-avatar.png" alt="Henry">
        </div>
        <span class="login-user-name">Henry</span>
      </div>
      <div class="login-user-card" data-user="guest" tabindex="0" role="button" aria-label="客人用户">
        <div class="login-user-avatar-ring">
          <img class="login-user-avatar" src="assets/icons/avatar.svg" alt="客人用户">
        </div>
        <span class="login-user-name">客人用户</span>
      </div>
    </div>
  </div>
  <div id="login-password-card" class="hidden">
    <div id="login-pw-back" role="button" tabindex="0" aria-label="返回用户选择">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <img id="login-pw-avatar" src="assets/icons/henry-avatar.png" alt="">
    <div id="login-pw-name">Henry</div>
    <div id="login-pw-input-row">
      <input id="login-password" type="password" placeholder="输入密码" aria-label="密码" autocomplete="off">
    </div>
    <div id="login-pw-hint">按 Enter 键登录</div>
    <div id="login-pw-error" class="hidden">密码不正确，请重试</div>
  </div>
</div>

<!-- 锁屏 -->
<div id="lockscreen" class="hidden">
  <div id="lockscreen-bg"></div>
  <div id="lockscreen-main">
    <div id="lock-date"></div>
    <div id="lock-time"></div>
  </div>
  <div id="lockscreen-user">
    <img id="lock-avatar" src="assets/icons/avatar.svg" alt="用户头像">
    <div id="lock-username">客人用户</div>
    <div id="lock-password-row" class="hidden">
      <input id="lock-password" type="password" placeholder="输入密码" aria-label="密码">
    </div>
    <div id="lock-hint">点按或按 Enter 键解锁</div>
    <div id="lock-error" class="hidden">密码不正确，请重试</div>
  </div>
</div>

<!-- 屏保 -->
<div id="screensaver" class="hidden"></div>

<!-- 开机画面 -->
<div id="bootscreen">
  <div id="boot-apple">
    <svg viewBox="0 0 384 512" width="72" height="96" aria-hidden="true"><path fill="#fff" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
  </div>
  <div id="boot-progress"><div id="boot-progress-fill"></div></div>
</div>

<!-- 关机画面 -->
<div id="poweroff" class="hidden">
  <div id="poweroff-text">已关机<br><span>点按屏幕以开机</span></div>
</div>

<script src="js/util.js"></script>
<script src="js/fs.js"></script>
<script src="js/wm.js"></script>
<script src="js/system.js"></script>
<script src="js/apps.js"></script>
<script src="js/apps2.js"></script>
<script src="js/settings.js"></script>
<script src="js/apps3.js"></script>
<script src="js/main.js"></script>
</body>
</html>
